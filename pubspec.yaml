name: test_hang_guard
description: >-
  Fails a Flutter test suite fast on the patterns that deadlock the test
  isolate, instead of letting the run hang with no output until the CI job
  timeout kills it.
version: 0.1.0
repository: https://github.com/saimskywalker/test-hang-guard

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.6.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  test_hang_guard: test_hang_guard
